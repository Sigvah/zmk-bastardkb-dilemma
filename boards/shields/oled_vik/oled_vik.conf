# Applied as a config fragment, which beats the Kconfig defaults. ZMK's
# display Kconfig pins LV_Z_MEM_POOL_SIZE to 4096 for the built-in status
# screen, a value meant for the 128x32 and 128x64 panels it usually drives.
# This panel is 128x128, four times the area of a 128x32, so set the heap
# here where the shield's own default cannot be overridden.
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# Enabled by default whenever the SSD1306 driver is in play, and the same
# trap as the underglow's AUTO_OFF_IDLE. This panel is on the peripheral
# half, whose activity state does not refresh from typing the way the
# central's does, so the display blanks after the idle timeout and never
# comes back. That reads as a screen that works for a moment after a flash
# and is blank from then on.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
