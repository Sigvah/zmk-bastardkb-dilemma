# Applied as a config fragment, which beats the Kconfig defaults. ZMK's
# display Kconfig pins LV_Z_MEM_POOL_SIZE to 4096 for the built-in status
# screen, a value meant for the 128x32 and 128x64 panels it usually drives.
# This panel is 128x128, four times the area of a 128x32, so set the heap
# here where the shield's own default cannot be overridden.
CONFIG_LV_Z_MEM_POOL_SIZE=16384
